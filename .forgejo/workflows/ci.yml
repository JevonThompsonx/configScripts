# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
name: ci
# Runs on merge to the default branch, plus a build on Renovate PRs. The PR
# trigger exists only so the merge bot (deploy/renovate-automerge.py) can land
# a dependency update after it compiles instead of waiting for a human. Every
# other PR is skipped by the job condition below: feature branches are covered
# by the local workflow and PR-Agent, and building them here would multiply
# runner load without proving anything new.
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Forgejo does not implement top-level `permissions:`; including it only
# produces a "not supported ... will be ignored" warning.

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: scripts · parse
    if: forgejo.event_name != 'pull_request' || startsWith(forgejo.event.pull_request.head.ref, 'renovate/')
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - name: parse ./
        run: |
          fail=0
          bash -n 'archSetup.sh' || { echo "FAIL archSetup.sh"; fail=1; }
          bash -n 'clamav-repair-notifications.sh' || { echo "FAIL clamav-repair-notifications.sh"; fail=1; }
          bash -n 'clamav-scan-fast.sh' || { echo "FAIL clamav-scan-fast.sh"; fail=1; }
          bash -n 'clamav-scan.sh' || { echo "FAIL clamav-scan.sh"; fail=1; }
          bash -n 'cloneConfigs.sh' || { echo "FAIL cloneConfigs.sh"; fail=1; }
          bash -n 'debianSetup.sh' || { echo "FAIL debianSetup.sh"; fail=1; }
          bash -n 'docsQubeSetup.sh' || { echo "FAIL docsQubeSetup.sh"; fail=1; }
          bash -n 'fedora.sh' || { echo "FAIL fedora.sh"; fail=1; }
          bash -n 'mediaQubeSetup.sh' || { echo "FAIL mediaQubeSetup.sh"; fail=1; }
          bash -n 'personalQubeSetup.sh' || { echo "FAIL personalQubeSetup.sh"; fail=1; }
          bash -n 'powerManagement.sh' || { echo "FAIL powerManagement.sh"; fail=1; }
          bash -n 'qubesSetup.sh' || { echo "FAIL qubesSetup.sh"; fail=1; }
          bash -n 'reverse-debianSetup.sh' || { echo "FAIL reverse-debianSetup.sh"; fail=1; }
          bash -n 'setup-clamav-cronjob.sh' || { echo "FAIL setup-clamav-cronjob.sh"; fail=1; }
          bash -n 'setup-clamav-sudo.sh' || { echo "FAIL setup-clamav-sudo.sh"; fail=1; }
          bash -n 'surfacePowerManagement.sh' || { echo "FAIL surfacePowerManagement.sh"; fail=1; }
          bash -n 'templateQubeSetup.sh' || { echo "FAIL templateQubeSetup.sh"; fail=1; }
          bash -n 'ubuntuServerSetup.sh' || { echo "FAIL ubuntuServerSetup.sh"; fail=1; }
          bash -n 'ufw.sh' || { echo "FAIL ufw.sh"; fail=1; }
          bash -n 'unifiedSetup.sh' || { echo "FAIL unifiedSetup.sh"; fail=1; }
          bash -n 'uninstall-apps.sh' || { echo "FAIL uninstall-apps.sh"; fail=1; }
          bash -n 'update-debian-sources.sh' || { echo "FAIL update-debian-sources.sh"; fail=1; }
          [ "$fail" -eq 0 ]
      - name: parse lib/
        run: |
          fail=0
          bash -n 'lib/common.sh' || { echo "FAIL lib/common.sh"; fail=1; }
          bash -n 'lib/configs.sh' || { echo "FAIL lib/configs.sh"; fail=1; }
          bash -n 'lib/desktop.sh' || { echo "FAIL lib/desktop.sh"; fail=1; }
          bash -n 'lib/fleet.sh' || { echo "FAIL lib/fleet.sh"; fail=1; }
          bash -n 'lib/macbook-touchbar.sh' || { echo "FAIL lib/macbook-touchbar.sh"; fail=1; }
          bash -n 'lib/neovim.sh' || { echo "FAIL lib/neovim.sh"; fail=1; }
          bash -n 'lib/packages.sh' || { echo "FAIL lib/packages.sh"; fail=1; }
          [ "$fail" -eq 0 ]
      - name: parse qubes/
        run: |
          fail=0
          bash -n 'qubes/docsSetup.sh' || { echo "FAIL qubes/docsSetup.sh"; fail=1; }
          bash -n 'qubes/mediaSetup.sh' || { echo "FAIL qubes/mediaSetup.sh"; fail=1; }
          bash -n 'qubes/personalSetup.sh' || { echo "FAIL qubes/personalSetup.sh"; fail=1; }
          bash -n 'qubes/qubesSetup.sh' || { echo "FAIL qubes/qubesSetup.sh"; fail=1; }
          bash -n 'qubes/templateSetup.sh' || { echo "FAIL qubes/templateSetup.sh"; fail=1; }
          [ "$fail" -eq 0 ]
      - name: parse server/
        run: |
          fail=0
          bash -n 'server/cloudflareIPsInteractive.sh' || { echo "FAIL server/cloudflareIPsInteractive.sh"; fail=1; }
          bash -n 'server/cloudflareIPscustom.sh' || { echo "FAIL server/cloudflareIPscustom.sh"; fail=1; }
          bash -n 'server/unifiedSetup.sh' || { echo "FAIL server/unifiedSetup.sh"; fail=1; }
          [ "$fail" -eq 0 ]
      - name: parse tests/
        run: |
          fail=0
          bash -n 'tests/containers.sh' || { echo "FAIL tests/containers.sh"; fail=1; }
          bash -n 'tests/run.sh' || { echo "FAIL tests/run.sh"; fail=1; }
          [ "$fail" -eq 0 ]
